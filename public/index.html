<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roamwise | AI Road Trips</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f2;color:#1b3029;font:16px system-ui,Arial}header{background:#173f34;color:white;padding:24px 5%}header h1{margin:0;font-size:32px}header p{margin:4px 0}main{max-width:850px;margin:24px auto;padding:0 16px}.panel{background:white;border:1px solid #dbe3dc;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 3px 12px #173f340b}h2{margin:0 0 12px}label{display:block;margin:14px 0 6px;font-weight:600}input,select,textarea{width:100%;padding:12px;border:1px solid #bacbc0;border-radius:9px;font:inherit}button{background:#21664e;color:white;border:0;border-radius:9px;padding:13px 18px;font:inherit;font-weight:700;cursor:pointer;margin-top:14px}button:disabled{opacity:.5}button.secondary{background:#e7eee9;color:#16402f}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.choice{display:flex;align-items:center;gap:9px;border:1px solid #c8d8cc;border-radius:9px;padding:10px;font-weight:400;margin:0}.choice input{width:auto}small,.muted{color:#64766b}.warning{color:#a34918}.stop{padding:12px;border-left:3px solid #2d7b5a;background:#f6faf7;margin:9px 0}.hidden{display:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.row{grid-template-columns:1fr}}</style></head><body><header><h1>Roamwise</h1><p>Discover the towns worth staying in. Let AI plan the adventures.</p></header><main><section class="panel"><h2>Build your road trip</h2><div class="row"><div><label for="state">Destination state</label><select id="state"></select></div><div><label for="days">Trip length (days)</label><input id="days" type="number" min="1" max="10" value="3"></div></div><label for="radius">Maximum driving time from your home base</label><select id="radius"><option value="30">30 minutes</option><option value="45">45 minutes</option><option value="60" selected>1 hour</option><option value="90">1.5 hours</option><option value="120">2 hours</option><option value="180">3 hours</option></select><label for="limitType">How should the driving limit work?</label><select id="limitType"><option value="oneway">One-way from town to stop</option><option value="total">Total round-trip driving time</option></select><label for="travelers">Who is traveling?</label><input id="travelers" placeholder="e.g., two adults and two kids, ages 6 and 9"><label for="interests">What experiences interest you?</label><textarea id="interests" rows="3" placeholder="e.g., quirky small towns, swimming holes, local diners, scenic backroads"></textarea><label for="avoid">Anything to avoid?</label><input id="avoid" placeholder="e.g., crowds, strenuous hikes, generic museums"><button id="ask">Discover state-specific questions</button><p class="muted">Your preferences are saved only in this browser. No account required.</p></section><section id="questions" class="panel hidden"><h2>Let's make it personal</h2><p id="intro"></p><div id="questionList"></div><button id="plan">Recommend my town and build my trip</button></section><section id="result" class="panel hidden"><h2>Your Roamwise itinerary</h2><div id="output"></div><label for="revision">Ask AI to change the trip</label><textarea id="revision" rows="2" placeholder="Find quieter towns, replace the museum, shorten day 2..."></textarea><button id="revise">Revise my trip</button><button class="secondary" onclick="window.print()">Print itinerary</button></section><p id="status" role="status"></p></main><script>
const states='Alabama Alaska Arizona Arkansas California Colorado Connecticut Delaware Florida Georgia Hawaii Idaho Illinois Indiana Iowa Kansas Kentucky Louisiana Maine Maryland Massachusetts Michigan Minnesota Mississippi Missouri Montana Nebraska Nevada New Hampshire New Jersey New Mexico New York North Carolina North Dakota Ohio Oklahoma Oregon Pennsylvania Rhode Island South Carolina South Dakota Tennessee Texas Utah Vermont Virginia Washington West Virginia Wisconsin Wyoming'.split(/,(?!)/);const all=['Alabama','Alaska','Arizona','Arkansas','California','Colorado','Connecticut','Delaware','Florida','Georgia','Hawaii','Idaho','Illinois','Indiana','Iowa','Kansas','Kentucky','Louisiana','Maine','Maryland','Massachusetts','Michigan','Minnesota','Mississippi','Missouri','Montana','Nebraska','Nevada','New Hampshire','New Jersey','New Mexico','New York','North Carolina','North Dakota','Ohio','Oklahoma','Oregon','Pennsylvania','Rhode Island','South Carolina','South Dakota','Tennessee','Texas','Utah','Vermont','Virginia','Washington','West Virginia','Wisconsin','Wyoming'];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('state').innerHTML=all.map(s=>'<option>'+s+'</option>').join('');$('state').value='Oklahoma';for(const id of ['state','days','radius','limitType','travelers','interests','avoid']){const saved=localStorage.getItem('roamwise_'+id);if(saved!==null)$(id).value=saved;$(id).addEventListener('change',()=>localStorage.setItem('roamwise_'+id,$(id).value))}let questions=[],current=null;const context=()=>({state:$('state').value,days:Number($('days').value),radius:Number($('radius').value),limitType:$('limitType').value,travelers:$('travelers').value,interests:$('interests').value,avoid:$('avoid').value,memory:JSON.parse(localStorage.getItem('roamwise_memory')||'{}')});async function post(url,data){$('status').textContent='AI is working on your trip…';try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');$('status').textContent='';return j}catch(e){$('status').textContent=(e instanceof TypeError?'Network request could not complete. Check your connection and retry. If this persists, the AI provider may be unavailable.':'Error: '+e.message);throw e}}$('ask').onclick=async()=>{if($('ask').disabled)return;const btn=$('ask');btn.disabled=true;btn.textContent='Finding questions…';try{const ctx=context();const cacheKey='roamwise_questions_'+JSON.stringify(ctx);let d;const cached=localStorage.getItem(cacheKey);if(cached){d=JSON.parse(cached);$('status').textContent='Using saved questions (no AI request).'}else{d=await post('/api/questions',ctx);localStorage.setItem(cacheKey,JSON.stringify(d))}questions=d.questions||[];$('intro').textContent=d.intro||'';$('questionList').innerHTML=questions.map((q,i)=>'<fieldset style="border:0;padding:8px 0"><legend><strong>'+esc(q.title)+'</strong></legend><div class="choices">'+(q.options||[]).map((o,k)=>'<label class="choice"><input type="checkbox" name="q'+i+'" value="'+k+'">'+esc(o)+'</label>').join('')+'</div></fieldset>').join('');$('questions').classList.remove('hidden')}catch{}finally{btn.disabled=false;btn.textContent='Discover state-specific questions'}};function answers(){return Object.fromEntries(questions.map((q,i)=>[q.title,[...document.querySelectorAll('input[name=q'+i+']:checked')].map(x=>q.options[Number(x.value)])]))}function render(d){current=d;const b=d.base||{};let html='<h3>Recommended home base: '+esc(b.town)+'</h3><p>'+esc(b.why)+'</p>';if(d.alternatives?.length)html+='<p><strong>Other towns worth considering:</strong> '+d.alternatives.map(x=>esc(x.town)+' — '+esc(x.why)).join('; ')+'</p>';for(const day of d.days||[]){html+='<h3>Day '+esc(day.day)+': '+esc(day.theme)+'</h3>';for(const s of day.stops||[]){html+='<div class="stop"><strong>'+esc(s.name)+'</strong> · '+esc(s.town)+'<p>'+esc(s.why)+'</p><small>'+(s.driveMinutes===null||s.driveMinutes===undefined?'Drive not verified':s.driveMinutes+' min from home-base town center')+'</small>'+(s.withinLimit===false?' <strong class="warning">Outside limit or unverified</strong>':'')+'</div>'}}html+='<p class="muted">'+esc(d.disclaimer||'Verify details before travel.')+'</p>';$('output').innerHTML=html;$('result').classList.remove('hidden');localStorage.setItem('roamwise_last_trip',JSON.stringify(d))}$('plan').onclick=async()=>{const btn=$('plan');if(btn.disabled)return;btn.disabled=true;btn.textContent='Building itinerary…';try{const a=answers();localStorage.setItem('roamwise_memory',JSON.stringify({answers:a,interests:$('interests').value,avoid:$('avoid').value}));const payload={...context(),answers:a};const cacheKey='roamwise_plan_'+JSON.stringify(payload);const cached=localStorage.getItem(cacheKey);if(cached){render(JSON.parse(cached));$('status').textContent='Showing your saved itinerary (no AI request).'}else{const trip=await post('/api/plan',payload);localStorage.setItem(cacheKey,JSON.stringify(trip));render(trip)}}catch{}finally{btn.disabled=false;btn.textContent='Recommend my town and build my trip'}};$('revise').onclick=async()=>{try{render(await post('/api/revise',{...context(),itinerary:current,request:$('revision').value}))}catch{}};const previous=localStorage.getItem('roamwise_last_trip');if(previous)try{render(JSON.parse(previous))}catch{}
</script></body></html>
